name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no argument, rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      # Tests see dev-dependency features; production must enable this itself (ADR-0009).
      - name: float_roundtrip is enabled without dev-dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo tree --locked -p quotalantern-protocol -e normal,features -i serde_json --prefix none -f '{p} {f}' \
            | grep -q '^serde_json .*float_roundtrip'
