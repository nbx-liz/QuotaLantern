[package]
name = "quotalantern-adapter-claude"
description = "Claude Code status line adapter: extracts allowlisted quota and context values (ADR-0002)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quotalantern-statusline"
path = "src/main.rs"

[dependencies]
quotalantern-protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: same float parsing as crates/protocol (ADR-0009).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
