[package]
name = "quotalantern-protocol"
description = "Internal event contract of QuotaLantern: strict parsing and validation (ADR-0009)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: correctly rounded float parsing, so that boundary values of
# used_percent get the same verdict as the schema validator. Required here and
# not only via a dev-dependency (ADR-0009); CI checks the non-dev graph.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
uuid = { version = "1.28.0", default-features = false, features = ["std"] }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }

[lints]
workspace = true
